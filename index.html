<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 WEATHER - TV</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root{
  --yellow:#FFD83D;
  --white:#FFFFFF;
  --black:#161616;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  background:var(--white);
}

body{
  font-family:"Noto Sans JP","Noto Sans KR",sans-serif;
  color:var(--black);
}

.tv{
  width:min(1100px,100%);
  margin:0 auto;
  padding:6px;
  background:var(--black);
}

.screen{
  position:relative;
  overflow:hidden;
  padding:9px 11px;
  background:var(--white);
  border:2px solid var(--black);
}

.screen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.035) 0px,
    rgba(0,0,0,.035) 1px,
    transparent 1px,
    transparent 5px
  );
}

.broadcast{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  padding:3px 7px;
  margin:-9px -11px 7px;
  background:var(--black);
  color:var(--yellow);
  font-size:7px;
  font-weight:900;
  letter-spacing:.8px;
}

.live{
  display:flex;
  align-items:center;
  gap:5px;
}

.live-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--yellow);
  animation:liveBlink 1s steps(1,end) infinite;
}

@keyframes liveBlink{
  0%, 49%{opacity:1;}
  50%, 100%{opacity:0.15;}
}

.header{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:1px 2px 6px;
  border-bottom:2px solid var(--black);
}

.title{
  font-size:clamp(19px,3.2vw,28px);
  font-weight:900;
  line-height:1;
  letter-spacing:-1px;
}

.subtitle{
  margin-top:3px;
  font-size:7px;
  font-weight:900;
  letter-spacing:1.2px;
}

.header-right{
  text-align:right;
  font-size:7px;
  font-weight:900;
  letter-spacing:.5px;
}

.section{
  position:relative;
  z-index:2;
  margin:6px 0 5px;
  font-size:8px;
  font-weight:900;
  letter-spacing:.8px;
}

.weather-frame{
  position:relative;
  z-index:2;
  padding:4px;
  background:var(--black);
}

.weather-inner{
  overflow:hidden;
  background:var(--white);
}

.weatherwidget-io{
  display:block !important;
  width:100% !important;
  min-height:125px;
  background:var(--cream) !important;
}

.footer{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:6px;
  font-weight:900;
  letter-spacing:.5px;
}

.signal{
  display:flex;
  gap:2px;
}

.signal i{
  width:4px;
  height:4px;
  background:var(--black);
}

@media(max-width:650px){
  .screen{
    padding:8px;
  }

  .broadcast{
    margin-left:-8px;
    margin-right:-8px;
  }
}
</style>
</head>

<body>

<div class="tv">

  <div class="screen">

    <div class="broadcast">
      <div class="live">
        <span class="live-dot"></span>
        ON AIR
      </div>
      <div>CHANNEL 04 / INABA</div>
    </div>

    <header class="header">

      <div>
        <div class="station">LOCAL TELEVISION</div>
        <div class="title">八十稲羽</div>
        <div class="subtitle">WEATHER REPORT</div>
      </div>

      <div class="clock">
        LIVE WEATHER
        <strong>WEATHER</strong>
        5-DAY FORECAST
      </div>

    </header>

    <div class="program">
      WEATHER REPORT
    </div>

    <div class="weather-frame">
      <div class="weather-inner">

        <a
          class="weatherwidget-io"
          href="https://forecast7.com/ja/35d66138d64/406-0028/"
          data-label_1="八十稲羽"
          data-label_2="WEATHER"
          data-font="Noto Sans Japanese"
          data-icons="Climacons Animated"
          data-days="5"
        >
          八十稲羽 WEATHER
        </a>

      </div>
    </div>

    <div class="caption">
      <div class="caption-left">
        LOCAL WEATHER / INABA
      </div>
      <div class="caption-right">
        40.6°N / 138.6°E
      </div>
    </div>

    <div class="tv-footer">
      <span>YASOINABA</span>
      <span class="signal">
        <i></i><i></i><i></i><i></i>
      </span>
    </div>

  </div>

</div>

<script>
!function(d,s,id){
  var js,fjs=d.getElementsByTagName(s)[0];
  if(!d.getElementById(id)){
    js=d.createElement(s);
    js.id=id;
    js.src='https://weatherwidget.io/js/widget.min.js';
    fjs.parentNode.insertBefore(js,fjs);
  }
}(document,'script','weatherwidget-io-js');
</script>

</body>
</html>
