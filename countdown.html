<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>INABA COUNTDOWN</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');


/* ========================================
   COLOR
   ======================================== */

:root{
  --yellow:#FFD83D;
  --white:#FFFFFF;
  --black:#161616;
}


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  padding:0;
  width:100%;
  background:var(--white);
}


body{
  font-family:"Noto Sans JP","Noto Sans KR",sans-serif;
  color:var(--black);
}


/* ========================================
   TV WIDGET
   ======================================== */

.tv{

  width:min(1100px,100%);

  margin:0 auto;

  padding:6px;

  background:var(--black);

  cursor:pointer;

  transition:
    transform .12s ease,
    background-color .12s ease,
    box-shadow .12s ease;

}


/* ========================================
   HOVER EFFECT
   ======================================== */

.tv:hover{

  background:var(--yellow);

  transform:translateY(-2px);

  box-shadow:
    0 4px 0 var(--black);

}


/* ========================================
   CLICK / PRESS EFFECT
   ======================================== */

.tv:active{

  transform:translateY(2px);

  box-shadow:none;

  background:var(--black);

}


/* ========================================
   SCREEN
   ======================================== */

.screen{

  position:relative;

  overflow:hidden;

  padding:9px 11px;

  background:var(--white);

  border:2px solid var(--black);

}


/* CRT SCANLINE */

.screen::before{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:10;

  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.035) 0px,
    rgba(0,0,0,.035) 1px,
    transparent 1px,
    transparent 5px
  );

}


/* ========================================
   SCREEN HOVER
   ======================================== */

.tv:hover .screen{

  border-color:var(--yellow);

}


/* ========================================
   BROADCAST / ON AIR
   ======================================== */

.broadcast{

  position:relative;

  z-index:2;

  display:flex;

  justify-content:space-between;

  padding:3px 7px;

  margin:-9px -11px 7px;

  background:var(--black);

  color:var(--yellow);

  font-size:9px;

  font-weight:900;

  letter-spacing:.8px;

}


.live{

  display:flex;

  align-items:center;

  gap:5px;

}


/* ========================================
   ON AIR BLINK
   ======================================== */

.live-dot{

  width:6px;

  height:6px;

  border-radius:50%;

  background:var(--yellow);

  animation:
    liveBlink 1s steps(1,end) infinite;

}


@keyframes liveBlink{

  0%,
  49%{
    opacity:1;
  }

  50%,
  100%{
    opacity:.15;
  }

}


/* ========================================
   BROADCAST HOVER
   ======================================== */

.tv:hover .broadcast{

  background:var(--yellow);

  color:var(--black);

}


.tv:hover .live-dot{

  background:var(--black);

}


/* ========================================
   HEADER
   ======================================== */

.header{

  position:relative;

  z-index:2;

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  padding:1px 2px 6px;

  border-bottom:2px solid var(--black);

}


.title{

  font-size:clamp(
    19px,
    3.2vw,
    28px
  );

  font-weight:900;

  line-height:1;

  letter-spacing:-1px;

}


.subtitle{

  margin-top:3px;

  font-size:7px;

  font-weight:900;

  letter-spacing:1px;

}


.header-right{

  text-align:right;

  font-size:7px;

  font-weight:900;

  letter-spacing:.4px;

}


/* ========================================
   SECTION
   ======================================== */

.section{

  position:relative;

  z-index:2;

  margin:6px 0 5px;

  font-size:8px;

  font-weight:900;

  letter-spacing:1px;

}


/* ========================================
   COUNTDOWN GRID
   ======================================== */

.countdowns{

  position:relative;

  z-index:2;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:6px;

}


/* ========================================
   CARD
   ======================================== */

.card{

  min-width:0;

  padding:6px 7px;

  background:var(--white);

  border:1.5px solid var(--black);

}


.card-top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:3px;

  margin-bottom:3px;

}


.type{

  font-size:7px;

  font-weight:900;

  letter-spacing:.4px;

}


.badge{

  padding:1px 3px;

  background:var(--black);

  color:var(--yellow);

  font-size:7px;

  font-weight:900;

}


/* ========================================
   D-DAY
   ======================================== */

.dday{

  margin:1px 0;

  font-size:clamp(
    21px,
    3vw,
    29px
  );

  font-weight:900;

  line-height:1;

  letter-spacing:-1px;

}


/* ========================================
   DATE
   ======================================== */

.date{

  font-size:9px;

  font-weight:700;

}


/* ========================================
   LABEL
   ======================================== */

.label{

  margin-top:4px;

  padding-top:4px;

  border-top:1px solid var(--black);

  font-size:9px;

  font-weight:900;

  line-height:1.2;

}


/* ========================================
   FOOTER
   ======================================== */

.footer{

  position:relative;

  z-index:2;

  display:flex;

  justify-content:space-between;

  margin-top:6px;

  font-size:6px;

  font-weight:900;

  letter-spacing:.5px;

}


.signal{

  display:flex;

  gap:2px;

}


.signal i{

  width:4px;

  height:4px;

  background:var(--black);

}


/* ========================================
   MOBILE
   ======================================== */

@media(max-width:420px){

  .countdowns{

    grid-template-columns:1fr;

  }

}


/* ========================================
   SMALL MOBILE
   ======================================== */

@media(max-width:390px){

  .screen{

    padding:8px;

  }


  .broadcast{

    margin-left:-8px;

    margin-right:-8px;

  }


  .countdowns{

    gap:5px;

  }

}


/* ========================================
   DISABLE HOVER ON TOUCH DEVICES
   ======================================== */

@media(hover:none){

  .tv:hover{

    transform:none;

    box-shadow:none;

    background:var(--black);

  }


  .tv:hover .screen{

    border-color:var(--black);

  }


  .tv:hover .broadcast{

    background:var(--black);

    color:var(--yellow);

  }


  .tv:hover .live-dot{

    background:var(--yellow);

  }

}

</style>

</head>


<body>


<!-- ========================================
     CLICKABLE TV WIDGET
     
     클릭하면 현재 노션 탭에서
     지정한 블록으로 이동
     ======================================== -->

<div
  class="tv"
  onclick="window.parent.location.href='https://app.notion.com/p/971eb70b1494828797b9014a055a2486?source=copy_link#78deb70b1494830587d2010f61b35698'"
>


  <div class="screen">


    <!-- ==================================
         ON AIR
         ================================== -->

    <div class="broadcast">

      <div class="live">

        <span class="live-dot"></span>

        ON AIR

      </div>


      <div>
        CHANNEL 04 / INABA
      </div>

    </div>



    <!-- ==================================
         HEADER
         ================================== -->

    <header class="header">

      <div>

        <div class="title">
          COUNTDOWN
        </div>


        <div class="subtitle">
          INABA PROJECT SCHEDULE
        </div>

      </div>


      <div class="header-right">

        LOCAL INFORMATION<br>

        4 EVENTS

      </div>

    </header>



    <!-- ==================================
         SECTION
         ================================== -->

    <div class="section">

      UPCOMING PROGRAM / D-DAY

    </div>



    <!-- ==================================
         COUNTDOWN
         ================================== -->

    <div class="countdowns">


      <!-- ================================
           1차 중간 점검
           ================================ -->

      <div class="card">

        <div class="card-top">

          <span class="type">
            CHECKPOINT
          </span>


          <span class="badge">
            점검
          </span>

        </div>


        <div
          class="dday"
          data-date="2026-12-21"
        >
          D-
        </div>


        <div class="date">

          2026.12.21

        </div>


        <div class="label">

          1차 중간 점검

        </div>

      </div>



      <!-- ================================
           페르소나 4 리버이벌
           ================================ -->

      <div class="card">

        <div class="card-top">

          <span class="type">
            RELEASE
          </span>


          <span class="badge">
            발매
          </span>

        </div>


        <div
          class="dday"
          data-date="2027-02-18"
        >
          D-
        </div>


        <div class="date">

          2027.02.18

        </div>


        <div class="label">

          🎮 페르소나 4 리버이벌 발매일

        </div>

      </div>


    </div>



    <!-- ==================================
         FOOTER
         ================================== -->

    <div class="footer">

      <span>
        YASOINABA
      </span>


      <span class="signal">

        <i></i>
        <i></i>
        <i></i>
        <i></i>

      </span>

    </div>


  </div>

</div>



<!-- ========================================
     D-DAY SCRIPT
     ======================================== -->

<script>


function updateDDays(){

  const now = new Date();

  now.setHours(
    0,
    0,
    0,
    0
  );


  document
    .querySelectorAll(".dday")
    .forEach(el => {


      const target =
        new Date(
          el.dataset.date +
          "T00:00:00"
        );


      const diff =
        Math.round(
          (target - now) /
          86400000
        );


      if(diff > 0){

        el.textContent =
          "D-" + diff;

      }


      else if(diff === 0){

        el.textContent =
          "D-DAY";

      }


      else{

        el.textContent =
          "D+" +
          Math.abs(diff);

      }

    });

}


/* 최초 실행 */

updateDDays();


/* 1시간마다 갱신 */

setInterval(
  updateDDays,
  60 * 60 * 1000
);


</script>


</body>
</html>
