<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 TV - BUTTONS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD83D;
  --white: #FFFFFF;
  --black: #161616;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--black); /* 전체 배경을 검정색으로 변경 */
  font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
  color: var(--white);
}

.container {
  width: min(900px, 92%);
  margin: 30px auto;
}

/* 3개 버튼 그리드 배치 */
.button-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 650px) {
  .button-grid {
    grid-template-columns: 1fr;
  }
}

/* 개별 버튼 카드 (애니메이션 유지) */
.btn-card {
  position: relative;
  background: var(--white); /* 외곽 테두리선을 대비되게 흰색으로 */
  padding: 4px;
  text-decoration: none;
  color: var(--white);
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}

.btn-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 0 var(--white);
}

.btn-card:active {
  transform: translateY(0);
  box-shadow: none;
}

/* 카드 내부 스크린 */
.btn-screen {
  position: relative;
  overflow: hidden;
  background: var(--black); /* 카드 내부 배경 검정색 */
  border: 2px solid var(--white); /* 내부 테두리 흰색 */
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 140px;
}

/* 스캔라인 효과 (밝은 톤으로 조정) */
.btn-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.05) 0px,
    rgba(255,255,255,.05) 1px,
    transparent 1px,
    transparent 5px
  );
}

/* 상단 정보 바 (채널 표시 유지) */
.btn-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px; /* 카테고리 글씨 확대 */
  font-weight: 900;
  letter-spacing: 0.8px;
  color: var(--white);
  border-bottom: 1px solid var(--white);
  padding-bottom: 6px;
  margin-bottom: 14px;
}

.btn-ch {
  background: var(--yellow); /* 채널 강조용 노란색 */
  color: var(--black);
  padding: 2px 6px;
  font-size: 9px;
  font-weight: 900;
}

/* 버튼 메인 콘텐츠 (이모티콘 제거 및 글씨 확대) */
.btn-content {
  display: flex;
  flex-direction: column;
  z-index: 2;
}

.btn-text-group {
  display: flex;
  flex-direction: column;
}

.btn-title {
  font-size: 22px; /* 메인 타이틀 크게 변경 */
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.5px;
  color: var(--white);
}

.btn-sub {
  font-size: 11px; /* 서브 타이틀 크게 변경 */
  font-weight: 700;
  color: var(--yellow); /* 노란색 포인트 */
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* 하단 화살표 (애니메이션 유지) */
.btn-footer {
  margin-top: 16px;
  text-align: right;
  font-size: 12px; /* 푸터 버튼 글씨 확대 */
  font-weight: 900;
  color: var(--white);
  z-index: 2;
}

.btn-card:hover .btn-footer::after {
  content: " ▶";
  color: var(--yellow);
}

.btn-footer::after {
  content: " ▷";
}

/* 전체 푸터 */
.global-footer {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: var(--white);
}
</style>
</head>

<body>

<div class="container">

  <!-- 3개 버튼 그리드 -->
  <div class="button-grid">

    <!-- 1. Discord -->
    <a href="https://discord.gg/5va5xhkArN" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>COMMUNITY</span>
          <span class="btn-ch">CH.01</span>
        </div>
        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">DISCORD</span>
            <span class="btn-sub">JOIN SERVER</span>
          </div>
        </div>
        <div class="btn-footer">CONNECT</div>
      </div>
    </a>

    <!-- 2. Excel Sheet -->
    <a href="https://docs.google.com/spreadsheets/d/1--wxXRh6sfSglIE_MzO9h17TzDCt5uPHY1PzYBvtyNE/edit?usp=sharing" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>DATABASE</span>
          <span class="btn-ch">CH.02</span>
        </div>
        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">EXCEL SHEET</span>
            <span class="btn-sub">VIEW DATA</span>
          </div>
        </div>
        <div class="btn-footer">OPEN</div>
      </div>
    </a>

    <!-- 3. X (Twitter) -->
    <a href="" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>SOCIAL MEDIA</span>
          <span class="btn-ch">CH.03</span>
        </div>
        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">X (TWITTER)</span>
            <span class="btn-sub">OFFICIAL PAGE</span>
          </div>
        </div>
        <div class="btn-footer">FOLLOW</div>
      </div>
    </a>

  </div>

  <!-- 푸터 -->
  <div class="global-footer">
    <div>SYSTEM STATUS: NORMAL</div>
    <div>八十稲羽 LOCAL BROADCASTING</div>
  </div>

</div>

</body>
</html>
