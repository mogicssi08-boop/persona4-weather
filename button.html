<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 TV - SLIM BUTTONS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD83D;
  --white: #FFFFFF;
  --black: #161616;
}

* {
  box-sizing: border-box;
}

/* 전체 배경은 원래대로(색 없음/흰색), 글자는 검정 기본 */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--white);
  font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
  color: var(--black);
}

.container {
  width: min(900px, 92%);
  margin: 40px auto;
}

/* 3개 버튼 그리드 배치 */
.button-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

@media (max-width: 650px) {
  .button-grid {
    grid-template-columns: 1fr;
  }
}

/* 개별 버튼 카드 컨테이너 */
.btn-card {
  position: relative;
  background: var(--black); /* 외곽 테두리 검정 */
  padding: 3px; /* 테두리 두께 얇게 */
  text-decoration: none;
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}

/* 호버 애니메이션 */
.btn-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 0 var(--black);
}

.btn-card:active {
  transform: translateY(0);
  box-shadow: none;
}

/* 카드 내부 스크린 - 얇고 슬림하게 높이 축소 */
.btn-screen {
  position: relative;
  overflow: hidden;
  background: var(--black); /* 내부 카드색 검정 */
  border: 1px solid rgba(255, 255, 255, 0.2); /* 안쪽 미세한 경계선 */
  padding: 12px 14px; /* 위아래 여백을 대폭 줄임 */
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 95px; /* 전체 카드 높이를 슬림하게 제한 */
}

/* 스캔라인 효과 */
.btn-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.04) 0px,
    rgba(255,255,255,.04) 1px,
    transparent 1px,
    transparent 4px
  );
}

/* 상단 정보 바 (채널 표시) */
.btn-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--white);
  border-bottom: 1px solid rgba(255, 255, 255, 0.3);
  padding-bottom: 4px;
  margin-bottom: 8px; /* 여백 줄임 */
}

.btn-ch {
  background: var(--yellow); /* 노란색 채널 뱃지 */
  color: var(--black);
  padding: 1px 5px;
  font-size: 8px;
  font-weight: 900;
  border-radius: 2px;
}

/* 버튼 메인 텍스트 그룹 */
.btn-content {
  display: flex;
  justify-content: space-between; /* 양쪽 정렬로 배치 변경 */
  align-items: flex-end; /* 텍스트와 화살표 하단 정렬 */
  z-index: 2;
  margin-top: auto; /* 남는 공간 위로 밀기 */
}

.btn-text-group {
  display: flex;
  flex-direction: column;
}

.btn-title {
  font-size: 20px; /* 큰 글씨 유지 */
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.5px;
  color: var(--white);
}

.btn-sub {
  font-size: 9px;
  font-weight: 700;
  color: var(--yellow);
  margin-top: 3px;
  letter-spacing: 0.5px;
}

/* 하단 우측 텍스트/화살표 (구조 변경하여 옆으로 배치) */
.btn-footer {
  font-size: 11px;
  font-weight: 900;
  color: var(--white);
}

.btn-card:hover .btn-footer::after {
  content: " ▶";
  color: var(--yellow);
}

.btn-footer::after {
  content: " ▷";
}

/* 전체 페이지 푸터 */
.global-footer {
  margin-top: 30px;
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: var(--black); /* 푸터 텍스트는 흰 배경이므로 검정색 */
  border-top: 2px solid var(--black);
  padding-top: 8px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 3개 슬림 버튼 그리드 -->
  <div class="button-grid">

    <!-- 1. Discord -->
    <a href="https://discord.gg/5va5xhkArN" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>COMMUNITY</span>
          <span class="btn-ch">CH.01</span>
        </div>
        
        <!-- 콘텐츠와 우측 하단 화살표를 한 줄(가로)에 배치하여 높이 절약 -->
        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">DISCORD</span>
            <span class="btn-sub">JOIN SERVER</span>
          </div>
          <div class="btn-footer"></div>
        </div>
      </div>
    </a>

    <!-- 2. Excel Sheet -->
    <a href="https://docs.google.com/spreadsheets/d/1--wxXRh6sfSglIE_MzO9h17TzDCt5uPHY1PzYBvtyNE/edit?usp=sharing" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>DATABASE</span>
          <span class="btn-ch">CH.02</span>
        </div>
        
        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">EXCEL SHEET</span>
            <span class="btn-sub">VIEW DATA</span>
          </div>
          <div class="btn-footer"></div>
        </div>
      </div>
    </a>

    <!-- 3. X (Twitter) -->
    <a href="" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>SOCIAL MEDIA</span>
          <span class="btn-ch">CH.03</span>
        </div>
        
        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">X (TWITTER)</span>
            <span class="btn-sub">OFFICIAL PAGE</span>
          </div>
          <div class="btn-footer"></div>
        </div>
      </div>
    </a>

  </div>

  <!-- 푸터 -->
  <div class="global-footer">
    <div>SYSTEM STATUS: NORMAL</div>
    <div>八十稲羽 LOCAL BROADCASTING</div>
  </div>

</div>

</body>
</html>
