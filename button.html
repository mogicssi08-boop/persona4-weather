<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 TV - BUTTONS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD83D;
  --white: #FFFFFF;
  --black: #161616;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--white);
  font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
  color: var(--black);
}

.container {
  width: min(900px, 92%);
  margin: 30px auto;
}

/* 상단 라이브 상태 바 */
.main-header {
  background: var(--black);
  color: var(--yellow);
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 20px;
  border: 2px solid var(--black);
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 6px;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--yellow);
  animation: liveBlink 1s steps(1, end) infinite;
}

@keyframes liveBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.15; }
}

/* 3개 버튼 그리드 배치 */
.button-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 650px) {
  .button-grid {
    grid-template-columns: 1fr;
  }
}

/* 개별 버튼 카드 */
.btn-card {
  position: relative;
  background: var(--black);
  padding: 4px;
  text-decoration: none;
  color: var(--black);
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}

.btn-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 0 var(--black);
}

.btn-card:active {
  transform: translateY(0);
  box-shadow: none;
}

/* 카드 내부 스크린 */
.btn-screen {
  position: relative;
  overflow: hidden;
  background: var(--white);
  border: 2px solid var(--black);
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 120px;
}

/* 스캔라인 효과 */
.btn-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.035) 0px,
    rgba(0,0,0,.035) 1px,
    transparent 1px,
    transparent 5px
  );
}

/* 상단 정보 바 */
.btn-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.8px;
  color: var(--black);
  border-bottom: 1px solid var(--black);
  padding-bottom: 4px;
  margin-bottom: 12px;
}

.btn-ch {
  background: var(--black);
  color: var(--yellow);
  padding: 1px 4px;
  font-size: 7px;
}

/* 버튼 메인 콘텐츠 */
.btn-content {
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 2;
}

.btn-icon {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
}

.btn-text-group {
  display: flex;
  flex-direction: column;
}

.btn-title {
  font-size: 16px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.5px;
}

.btn-sub {
  font-size: 8px;
  font-weight: 700;
  color: #666;
  margin-top: 3px;
  letter-spacing: 0.5px;
}

/* 하단 화살표 */
.btn-footer {
  margin-top: 14px;
  text-align: right;
  font-size: 10px;
  font-weight: 900;
  color: var(--black);
  z-index: 2;
}

.btn-card:hover .btn-footer::after {
  content: " ▶";
  color: #E60012;
}

.btn-footer::after {
  content: " ▷";
}

/* 푸터 */
.global-footer {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.5px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 메인 헤더 -->
  <div class="main-header">
    <div class="live-badge">
      <span class="live-dot"></span>
      ON AIR / CHANNEL 04 INABA
    </div>
    <div>QUICK LINKS</div>
  </div>

  <!-- 3개 버튼 그리드 -->
  <div class="button-grid">

    <!-- 1. Discord -->
    <a href="https://discord.gg/5va5xhkArN" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>COMMUNITY</span>
          <span class="btn-ch">CH.01</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">💬</span>
          <div class="btn-text-group">
            <span class="btn-title">DISCORD</span>
            <span class="btn-sub">JOIN SERVER</span>
          </div>
        </div>
        <div class="btn-footer">CONNECT</div>
      </div>
    </a>

    <!-- 2. Excel Sheet -->
    <a href="https://docs.google.com/spreadsheets/d/1--wxXRh6sfSglIE_MzO9h17TzDCt5uPHY1PzYBvtyNE/edit?usp=sharing" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>DATABASE</span>
          <span class="btn-ch">CH.02</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">📊</span>
          <div class="btn-text-group">
            <span class="btn-title">EXCEL SHEET</span>
            <span class="btn-sub">VIEW DATA</span>
          </div>
        </div>
        <div class="btn-footer">OPEN</div>
      </div>
    </a>

    <!-- 3. X (Twitter) -->
    <a href="" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>SOCIAL MEDIA</span>
          <span class="btn-ch">CH.03</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">𝕏</span>
          <div class="btn-text-group">
            <span class="btn-title">X (TWITTER)</span>
            <span class="btn-sub">OFFICIAL PAGE</span>
          </div>
        </div>
        <div class="btn-footer">FOLLOW</div>
      </div>
    </a>

  </div>

  <!-- 푸터 -->
  <div class="global-footer">
    <div>SYSTEM STATUS: NORMAL</div>
    <div>八十稲羽 LOCAL BROADCASTING</div>
  </div>

</div>

</body>
</html>
