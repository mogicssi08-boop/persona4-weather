<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 TV - SLIM BUTTONS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD83D;
  --white: #FFFFFF;
  --black: #161616;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--white);
  font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
  color: var(--black);
}

.container {
  width: min(900px, 92%);
  margin: 40px auto;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

@media (max-width: 650px) {
  .button-grid {
    grid-template-columns: 1fr;
  }
}

.btn-card {
  position: relative;
  background: var(--black);
  padding: 3px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}

.btn-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 0 var(--black);
}

.btn-card:active {
  transform: translateY(0);
  box-shadow: none;
}

.btn-screen {
  position: relative;
  overflow: hidden;
  background: var(--black);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 95px;
}

.btn-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.04) 0px,
    rgba(255,255,255,.04) 1px,
    transparent 1px,
    transparent 4px
  );
}

.btn-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--white);
  border-bottom: 1px solid rgba(255, 255, 255, 0.3);
  padding-bottom: 4px;
  margin-bottom: 8px;
}

.btn-ch {
  background: var(--yellow);
  color: var(--black);
  padding: 1px 5px;
  font-size: 8px;
  font-weight: 900;
  border-radius: 2px;
}

.btn-content {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  z-index: 2;
  margin-top: auto;
}

.btn-text-group {
  display: flex;
  flex-direction: column;
}

.btn-title {
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.5px;
  color: var(--white);
}

.btn-sub {
  font-size: 9px;
  font-weight: 700;
  color: var(--yellow);
  margin-top: 3px;
  letter-spacing: 0.5px;
}

.btn-footer {
  font-size: 11px;
  font-weight: 900;
  color: var(--white);
}

.btn-card:hover .btn-footer::after {
  content: " ▶";
  color: var(--yellow);
}

.btn-footer::after {
  content: " ▷";
}

.global-footer {
  margin-top: 30px;
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: var(--black);
  border-top: 2px solid var(--black);
  padding-top: 8px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 3개 슬림 버튼 그리드 -->
  <div class="button-grid">

    <!-- 1. Project Plan -->
    <a href="https://drive.google.com/file/d/1rcYmcJ27AqZaCXUrpGesbCaBpnqRPDrY/view?usp=sharing"
       target="_blank"
       class="btn-card">

      <div class="btn-screen">

        <div class="btn-top-bar">
          <span>PROJECT</span>
          <span class="btn-ch">CH.01</span>
        </div>

        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">PROJECT PLAN</span>
            <span class="btn-sub">VIEW PLAN</span>
          </div>

          <div class="btn-footer"></div>
        </div>

      </div>
    </a>


    <!-- 2. Excel Sheet -->
    <a href="https://docs.google.com/spreadsheets/d/1--wxXRh6sfSglIE_MzO9h17TzDCt5uPHY1PzYBvtyNE/edit?usp=sharing"
       target="_blank"
       class="btn-card">

      <div class="btn-screen">

        <div class="btn-top-bar">
          <span>DATABASE</span>
          <span class="btn-ch">CH.02</span>
        </div>

        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">EXCEL SHEET</span>
            <span class="btn-sub">VIEW DATA</span>
          </div>

          <div class="btn-footer"></div>
        </div>

      </div>
    </a>


    <!-- 3. X (Twitter) -->
    <a href=""
       target="_blank"
       class="btn-card">

      <div class="btn-screen">

        <div class="btn-top-bar">
          <span>SOCIAL MEDIA</span>
          <span class="btn-ch">CH.03</span>
        </div>

        <div class="btn-content">
          <div class="btn-text-group">
            <span class="btn-title">X (TWITTER)</span>
            <span class="btn-sub">OFFICIAL PAGE</span>
          </div>

          <div class="btn-footer"></div>
        </div>

      </div>
    </a>

  </div>


  <!-- 푸터 -->
  <div class="global-footer">
    <div>SYSTEM STATUS: NORMAL</div>
    <div>八十稲羽 LOCAL BROADCASTING</div>
  </div>

</div>

</body>
</html>
