<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 TV - SEPARATE BUTTONS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD83D;
  --white: #FFFFFF;
  --black: #161616;
  --gray: #ECECEC;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--white);
  font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
  color: var(--black);
}

.container {
  width: min(1000px, 92%);
  margin: 30px auto;
}

/* 상단 메인 라이브 헤더 바 */
.main-header {
  background: var(--black);
  color: var(--yellow);
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 20px;
  border: 2px solid var(--black);
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 6px;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--yellow);
  animation: liveBlink 1s steps(1, end) infinite;
}

@keyframes liveBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.15; }
}

/* 분리된 버튼들을 배치할 그리드 레이아웃 */
.button-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

/* 개별 버튼 카드 (분리형 TV 프레임) */
.btn-card {
  position: relative;
  background: var(--black);
  padding: 4px;
  text-decoration: none;
  color: var(--black);
  display: flex;
  flex-direction: column;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}

.btn-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 0 var(--black);
}

.btn-card:active {
  transform: translateY(0);
  box-shadow: none;
}

/* 개별 카드 내부 스크린 */
.btn-screen {
  position: relative;
  overflow: hidden;
  background: var(--white);
  border: 2px solid var(--black);
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 120px;
}

/* 레트로 스캔라인 효과 */
.btn-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.035) 0px,
    rgba(0,0,0,.035) 1px,
    transparent 1px,
    transparent 5px
  );
}

/* 버튼 카드 상단 라벨 */
.btn-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.8px;
  color: var(--black);
  border-bottom: 1px solid var(--black);
  padding-bottom: 4px;
  margin-bottom: 10px;
}

.btn-ch {
  background: var(--black);
  color: var(--yellow);
  padding: 1px 4px;
  font-size: 7px;
}

/* 버튼 카드 메인 콘텐츠 */
.btn-content {
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 2;
}

.btn-icon {
  font-size: 24px;
  line-height: 1;
}

.btn-text-group {
  display: flex;
  flex-direction: column;
}

.btn-title {
  font-size: 16px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.5px;
}

.btn-sub {
  font-size: 8px;
  font-weight: 700;
  color: #666;
  margin-top: 2px;
  letter-spacing: 0.5px;
}

/* 버튼 카드 하단 화살표 표시 */
.btn-footer {
  margin-top: 12px;
  text-align: right;
  font-size: 10px;
  font-weight: 900;
  color: var(--black);
  z-index: 2;
}

.btn-card:hover .btn-footer::after {
  content: " ▶";
  color: #E60012;
}

.btn-footer::after {
  content: " ▷";
}

/* 하단 푸터 */
.global-footer {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.5px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 상단 시스템 브로드캐스트 바 -->
  <div class="main-header">
    <div class="live-badge">
      <span class="live-dot"></span>
      ON AIR / CHANNEL 04 INABA
    </div>
    <div>QUICK MENU SYSTEM</div>
  </div>

  <!-- 분리된 버튼 그리드 -->
  <div class="button-grid">

    <!-- 버튼 1 -->
    <a href="https://example.com" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>LOCAL TV</span>
          <span class="btn-ch">CH.01</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">📺</span>
          <div class="btn-text-group">
            <span class="btn-title">날씨 정보</span>
            <span class="btn-sub">WEATHER REPORT</span>
          </div>
        </div>
        <div class="btn-footer">SELECT</div>
      </div>
    </a>

    <!-- 버튼 2 -->
    <a href="https://example.com" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>COMMUNITY</span>
          <span class="btn-ch">CH.02</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">💬</span>
          <div class="btn-text-group">
            <span class="btn-title">게시판</span>
            <span class="btn-sub">COMMUNITY BOARD</span>
          </div>
        </div>
        <div class="btn-footer">SELECT</div>
      </div>
    </a>

    <!-- 버튼 3 -->
    <a href="https://example.com" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>MUSIC STREAM</span>
          <span class="btn-ch">CH.03</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">🎵</span>
          <div class="btn-text-group">
            <span class="btn-title">BGM 플레이어</span>
            <span class="btn-sub">SOUNDTRACK</span>
          </div>
        </div>
        <div class="btn-footer">SELECT</div>
      </div>
    </a>

    <!-- 버튼 4 -->
    <a href="https://example.com" target="_blank" class="btn-card">
      <div class="btn-screen">
        <div class="btn-top-bar">
          <span>EXTERNAL LINK</span>
          <span class="btn-ch">CH.04</span>
        </div>
        <div class="btn-content">
          <span class="btn-icon">🔗</span>
          <div class="btn-text-group">
            <span class="btn-title">바로가기</span>
            <span class="btn-sub">INDIFY LINK</span>
          </div>
        </div>
        <div class="btn-footer">SELECT</div>
      </div>
    </a>

  </div>

  <!-- 하단 상태 라인 -->
  <div class="global-footer">
    <div>SYSTEM STATUS: NORMAL</div>
    <div>八十稲羽 LOCAL BROADCASTING</div>
  </div>

</div>

</body>
</html>
