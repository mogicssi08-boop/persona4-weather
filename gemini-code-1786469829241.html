<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八十稲羽 TV - BUTTON</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

:root {
  --yellow: #FFD83D;
  --white: #FFFFFF;
  --black: #161616;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: var(--white);
  font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
  color: var(--black);
}

.tv {
  width: min(1100px, 100%);
  margin: 0 auto;
  padding: 6px;
  background: var(--black);
}

.screen {
  position: relative;
  overflow: hidden;
  padding: 9px 11px 16px;
  background: var(--white);
  border: 2px solid var(--black);
}

/* TV 레트로 스캔라인 효과 */
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.035) 0px,
    rgba(0,0,0,.035) 1px,
    transparent 1px,
    transparent 5px
  );
}

/* 상단 라이브 상태 바 */
.broadcast {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  padding: 3px 7px;
  margin: -9px -11px 12px;
  background: var(--black);
  color: var(--yellow);
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .8px;
}

.live {
  display: flex;
  align-items: center;
  gap: 5px;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--yellow);
  animation: liveBlink 1s steps(1,end) infinite;
}

@keyframes liveBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.15; }
}

/* 헤더 영역 */
.header {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 1px 2px 10px;
  border-bottom: 2px solid var(--black);
  margin-bottom: 15px;
}

.station {
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .8px;
  color: var(--black);
}

.title {
  font-size: clamp(19px, 3.2vw, 28px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1px;
}

.subtitle {
  margin-top: 3px;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: 1.2px;
}

.header-right {
  text-align: right;
  font-size: 7px;
  font-weight: 900;
  letter-spacing: .5px;
  line-height: 1.3;
}

/* 버튼 프레임 영역 */
.button-frame {
  position: relative;
  z-index: 2;
  padding: 4px;
  background: var(--black);
}

.button-inner {
  position: relative;
  overflow: hidden;
  background: var(--white);
  min-height: 160px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 임베드 iframe */
.indify-iframe {
  width: 100%;
  height: 160px;
  border: none;
  display: block;
}

/* 하단 푸터 */
.footer {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 6px;
  font-weight: 900;
  letter-spacing: .5px;
}

@media(max-width: 650px) {
  .screen {
    padding: 8px 8px 12px;
  }
  .broadcast {
    margin-left: -8px;
    margin-right: -8px;
  }
}
</style>
</head>

<body>

<div class="tv">
  <div class="screen">

    <!-- 라이브 전송 바 -->
    <div class="broadcast">
      <div class="live">
        <span class="live-dot"></span>
        ON AIR
      </div>
      <div>CHANNEL 04 / INABA</div>
    </div>

    <!-- 타이틀 헤더 -->
    <header class="header">
      <div>
        <div class="station">LOCAL TELEVISION</div>
        <div class="title">八十稲羽</div>
        <div class="subtitle">QUICK BUTTON</div>
      </div>
      <div class="header-right">
        LIVE ACTION<br>
        <strong>BUTTON WIDGET</strong><br>
        INDIFY EMBED
      </div>
    </header>

    <!-- Indify 버튼 임베드 프레임 -->
    <div class="button-frame">
      <div class="button-inner">
        <iframe 
          class="indify-iframe" 
          src="https://indify.co/widgets/live/button/XyPDEzCAk0x9qIhWjYd3"
          scrolling="no"
          loading="lazy">
        </iframe>
      </div>
    </div>

    <!-- 하단 상태 표시 -->
    <div class="footer">
      <div>SYSTEM OK</div>
      <div>SIGNAL: STABLE</div>
    </div>

  </div>
</div>

</body>
</html>
